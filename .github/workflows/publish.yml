name: Daily Cyber Briefing (publish)

on:
  schedule:
    # 08:00 UTC every day — the briefing refreshes itself
    - cron: '0 8 * * *'
    # weekly deep refresh (Sunday 07:00 UTC)
    - cron: '0 7 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyber-briefing-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Re-collect so the published page is never stale, even when the local
      # cron box was asleep. data/intel.json (council findings) is read from
      # the repo and preserved. This job NEVER commits back to main — the
      # local pipeline owns the repository, so the two never collide.
      - name: Collect fresh intel
        run: python3 scripts/collect.py

      - name: Render the page
        run: python3 scripts/render.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
